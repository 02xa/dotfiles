input {
    kb_layout = br,us
    kb_variant = ,dvorak
    kb_options = compose:rctrl, level3:ralt_switch, grp:win_space_toggle

    follow_mouse = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        scroll_factor = 0.5
    }
}

cursor {
  inactive_timeout = 3
}
