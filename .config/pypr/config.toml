[pyprland]
plugins = ["scratchpads", "magnify"]

[scratchpads.volume]
command = "pavucontrol"
unfocus = "hide"
position = "1% 8%"
lazy = true

[scratchpads.dots]
command = "kitty --class=scratchpad-large yadm enter lazygit"
lazy = true

[scratchpads.yazi]
command = "kitty --class=scratchpad-large fish -c yazi"
unfocus = "hide"
hysteresis = 0.1
lazy = true

[scratchpads.gpt]
command = "kitty --class=scratchpad-large tgpt -m"
lazy = true

[scratchpads.btop]
command = "kitty --class=scratchpad-large btop"
lazy = true

[scratchpads.nvtop]
command = "kitty --class=scratchpad-large nvtop"
lazy = true

[scratchpads.topgrade-system]
command = "kitty --class=scratchpad-large fish -c 'up'"
lazy = true

[scratchpads.topgrade-all]
command = "kitty --class=scratchpad-large fish -c 'upall'"
lazy = true

[scratchpads.bluetooth]
command = "overskride"
animation = "fromRight"
size = "52% 92%"
position = "47% 6%"
margin = 20
lazy = true

[scratchpads.wifi]
command = "iwgtk"
animation = "fromRight"
margin = 20
lazy = true

[scratchpads.network]
command = "nm-connection-editor"
animation = "fromRight"
size = "52% 92%"
position = "47% 6%"
margin = 20
lazy = true
